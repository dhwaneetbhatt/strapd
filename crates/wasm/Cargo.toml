[package]
name = "strapd-wasm"
version = "1.5.1"
edition = "2024"

[lib]
crate-type = ["cdylib"]

[dependencies]
strapd-core = { path = "../core", features = ["browser"] }
wasm-bindgen = "0.2.129"
getrandom = { version = "0.4.3", features = ["wasm_js"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.152"
