[package]
name = "strapd-wasm"
version = "1.4.0"
edition = "2024"

[lib]
crate-type = ["cdylib"]

[dependencies]
strapd-core = { path = "../core" }
wasm-bindgen = "0.2.129"
getrandom = { version = "0.4.3", features = ["wasm_js"] }
web-sys = { version = "0.3.106", features = ["console"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.152"
