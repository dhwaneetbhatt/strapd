[package]
name = "strapd-core"
version = "1.4.0"
edition = "2024"

[dependencies]
base64 = "0.23.1"
chrono = "0.4.45"
hex = "0.4.3"
getrandom = { version = "0.4.3", features = ["wasm_js"] }
hmac = "0.13.0"
json = "0.12.4"
md-5 = "0.11.0"
quick-xml = "0.42.0"
rand = "0.10.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.152"
sha1 = "0.11.0"
sha2 = "0.11.0"
sqlparse = "0.3.3"
urlencoding = "2.1.3"
ulid = "3.0.0"
uuid = { version = "1.28.0", features = ["v4", "v7", "js"] }
yaml-rust = "0.4.5"
